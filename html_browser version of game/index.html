const BAE = {
  log: [],
  record(level, choice, isCorrect, timeMs, choiceType) {
    this.log.push({ level, choice, isCorrect, timeMs, choiceType });
  },
  computeRisk() {
    if (!this.log.length) return 0;
    let risk = 0;
    this.log.forEach(e => {
      if (!e.isCorrect) risk += 20;
      if (e.timeMs < 4000 && !e.isCorrect) risk += 10;
      if (e.choiceType === "authority" && !e.isCorrect) risk += 8;
      if (e.choiceType === "urgency" && !e.isCorrect) risk += 8;
    });
    return Math.min(100, Math.round(risk / this.log.length * 2.5));
  },
  pattern() {
    if (!this.log.length) return "Analysing...";
    const r = this.log.filter(e => !e.isCorrect).length / this.log.length;
    if (r === 0) return "🛡️ Hyper-Vigilant";
    if (r < 0.3) return "⚠️ Cautious but Vulnerable";
    if (r < 0.6) return "😟 Too Trusting";
    return "🚨 High Risk Behaviour";
  },
  reset() { this.log = []; }
};

const BADGES = [
  { id:"sniper",   icon:"🎯", name:"Phishing Sniper",  desc:"Identified first scam correctly",   cond:s=>s.correctFirst },
  { id:"survivor", icon:"🛡️", name:"Scam Survivor",    desc:"Completed 3+ levels",               cond:s=>s.levelsCompleted>=3 },
  { id:"trusting", icon:"😅", name:"Too Trusting",     desc:"Fell for 2+ scams",                 cond:s=>s.wrongCount>=2 },
  { id:"firewall", icon:"🔥", name:"Human Firewall",   desc:"All levels with 70+ trust",         cond:s=>s.levelsCompleted===5&&s.trust>=70 },
  { id:"master",   icon:"💎", name:"Cyber Master",     desc:"Perfect run ; no money lost",       cond:s=>s.levelsCompleted===5&&s.moneyLost===0 },
];

const fmt = n => "$" + Number(n).toLocaleString();

function TypingText({ text, speed = 22 }) {
  const [shown, setShown] = useState("");
  useEffect(() => {
    setShown("");
    let i = 0;
    const id = setInterval(() => { i++; setShown(text.slice(0, i)); if (i >= text.length) clearInterval(id); }, speed);
    return () => clearInterval(id);
  }, [text]);
  return <span style={{ whiteSpace: "pre-wrap" }}>{shown}<span style={{ color: "#00ff9c", animation: "blink 1s step-end infinite" }}>▌</span></span>;
}

function TimerRing({ value, max }) {
  const r = 28, circ = 2 * Math.PI * r;
  const offset = circ * (1 - (max > 0 ? value / max : 0));
  const color = value <= 10 ? "#ff3b3b" : value <= 20 ? "#facc15" : "#00ff9c";
  return (
    <div style={{ position: "relative", width: 76, height: 76, flexShrink: 0 }}>
      <svg width="76" height="76" style={{ transform: "rotate(-90deg)" }}>
        <circle cx="38" cy="38" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="6" />
        <circle cx="38" cy="38" r={r} fill="none" stroke={color} strokeWidth="6"
          strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset 1s linear, stroke 0.4s", filter: "drop-shadow(0 0 5px " + color + ")" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <span style={{ fontFamily: "monospace", fontSize: 17, fontWeight: 700, color, lineHeight: 1 }}>{value}</span>
        <span style={{ fontSize: 9, color: "#555", letterSpacing: 1 }}>SEC</span>
      </div>
    </div>
  );
}

function TrustBar({ value }) {
  const color = value > 60 ? "#00ff9c" : value > 30 ? "#facc15" : "#ff3b3b";
  return (
    <div style={{ minWidth: 180 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
        <span style={{ fontSize: 10, color: "#555", letterSpacing: 1, textTransform: "uppercase" }}>Trust ❤️</span>
        <span style={{ fontFamily: "monospace", fontSize: 13, color, fontWeight: 700 }}>{value}</span>
      </div>
      <div style={{ width: "100%", height: 7, background: "rgba(255,255,255,0.06)", borderRadius: 6, overflow: "hidden" }}>
        <div style={{ height: "100%", width: value + "%", background: color, borderRadius: 6, transition: "width 0.7s ease, background 0.5s", boxShadow: "0 0 8px " + color + "88" }} />
      </div>
    </div>
  );
}

function HUD({ trust, money, riskScore, level, badges, onBoard, onDocs, onReset }) {
  const rColor = riskScore > 60 ? "#ff3b3b" : riskScore > 30 ? "#facc15" : "#00ff9c";
  const [imgErr, setImgErr] = useState(false);
  return (
    <div style={{ background: "rgba(5,6,15,0.92)", borderBottom: "1px solid rgba(0,255,156,0.1)", backdropFilter: "blur(16px)", padding: "10px 20px", display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap", position: "sticky", top: 0, zIndex: 100 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        {imgErr
          ? <span style={{ fontSize: 20 }}>🛡️</span>
          : <img src={LOGO_SRC} onError={() => setImgErr(true)} style={{ width: 30, height: 30, objectFit: "contain", borderRadius: 6, filter: "drop-shadow(0 0 6px rgba(0,200,255,0.6))" }} alt="" />
        }
        <span style={{ fontFamily: "monospace", fontSize: 13, color: "#00c8ff", letterSpacing: 1, fontWeight: 700 }}>CYBER SHIELD</span>
      </div>
      <div style={{ flex: "1 1 200px" }}><TrustBar value={trust} /></div>
      {[["💰", fmt(money), "#00ff9c"], ["🧠", riskScore, rColor], ["📊", (level + 1) + "/5", "#a78bfa"]].map(([icon, val, col]) => (
        <div key={icon} style={{ textAlign: "center", minWidth: 52 }}>
          <div style={{ fontSize: 9, color: "#444", letterSpacing: 1, textTransform: "uppercase", marginBottom: 2 }}>{icon}</div>
          <div style={{ fontFamily: "monospace", fontSize: 14, color: col, fontWeight: 700 }}>{val}</div>
        </div>
      ))}
      {badges.length > 0 && <div style={{ display: "flex", gap: 4 }}>{badges.map(b => <span key={b.id} title={b.name} style={{ fontSize: 15 }}>{b.icon}</span>)}</div>}
      <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
        {[["🏆", onBoard], ["📄", onDocs], ["↩", onReset]].map(([t, fn]) => (
          <button key={t} onClick={fn} style={{ padding: "6px 12px", borderRadius: 18, border: "1px solid rgba(0,255,156,0.25)", background: "transparent", color: "#7fcfaa", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>{t}</button>
        ))}
      </div>
    </div>
  );
}

function Flags({ flags }) {

    </div>
  );
}

function ChoiceBtn({ choice, onChoose }) {
  const [hover, setHover] = useState(false);
  const safe = choice.correct || choice.type === "safe";
  return (
    <button onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} onClick={() => onChoose(choice)}
      style={{ width: "100%", textAlign: "left", padding: "12px 16px", border: "1px solid " + (hover ? (safe ? "rgba(0,255,156,0.7)" : "rgba(255,59,59,0.7)") : (safe ? "rgba(0,255,156,0.2)" : "rgba(255,59,59,0.25)")), borderRadius: 12, background: hover ? (safe ? "rgba(0,255,156,0.08)" : "rgba(255,59,59,0.08)") : (safe ? "rgba(0,255,156,0.03)" : "rgba(255,59,59,0.04)"), color: safe ? "#c8f0e0" : "#f8d0d0", fontFamily: "'Inter',sans-serif", fontSize: 13.5, fontWeight: 500, cursor: "pointer", marginBottom: 8, transform: hover ? "translateX(4px)" : "translateX(0)", transition: "all 0.18s", boxShadow: hover ? ("0 0 12px " + (safe ? "rgba(0,255,156,0.15)" : "rgba(255,59,59,0.15)")) : "none" }}>
      {choice.text}
    </button>
  );
}

function Card({ children, danger, style: extra, className }) {
  return (
    <div className={className} style={{ background: "rgba(10,14,30,0.88)", borderRadius: 18, border: "1px solid " + (danger ? "rgba(255,59,59,0.25)" : "rgba(0,255,156,0.12)"), backdropFilter: "blur(12px)", boxShadow: danger ? "0 8px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255,59,59,0.08)" : "0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)", ...extra }}>{children}</div>
  );
}

function BG() {

    <div style={{ position: "fixed", inset: 0, zIndex: -1, overflow: "hidden", pointerEvents: "none" }}>
      <div style={{ position: "absolute", width: 600, height: 600, borderRadius: "50%", background: "radial-gradient(circle,rgba(0,255,156,0.06) 0%,transparent 70%)", top: "-10%", right: "-5%" }} />
      <div style={{ position: "absolute", width: 500, height: 500, borderRadius: "50%", background: "radial-gradient(circle,rgba(139,92,246,0.05) 0%,transparent 70%)", bottom: "5%", left: "-5%" }} />
      <div style={{ position: "absolute", inset: 0, background: "repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,156,0.012) 2px,rgba(0,255,156,0.012) 4px)" }} />
    </div>
  );
}

function PrimaryBtn({ children, onClick, danger }) {
  const [hover, setHover] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ width: "100%", padding: 13, borderRadius: 12, border: "none", cursor: "pointer", fontSize: 14, fontWeight: 700, fontFamily: "'Inter',sans-serif", background: danger ? "linear-gradient(135deg,#ff3b3b,#aa0000)" : "linear-gradient(135deg,#00ff9c,#00b36b)", color: danger ? "#fff" : "#03100a", boxShadow: hover ? "0 8px 30px rgba(0,255,156,0.5)" : "0 4px 20px rgba(0,255,156,0.3)", transform: hover ? "translateY(-2px)" : "translateY(0)", transition: "all 0.18s" }}>
      {children}
    </button>
  );
}

function LogoImage({ size = 160 }) {
  const [err, setErr] = useState(false);
  return (
    <div style={{ width: size, height: size, borderRadius: 24, padding: 4, background: "linear-gradient(135deg, rgba(0,200,255,0.4), rgba(168,85,247,0.4))", boxShadow: "0 0 30px rgba(0,200,255,0.35), 0 0 60px rgba(168,85,247,0.2)" }} className="logo-glow">
      {err
        ? <div style={{ width: "100%", height: "100%", borderRadius: 20, background: "linear-gradient(135deg,#0a1628,#1a0a2e)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: size * 0.45 }}>🛡️</div>
        : <img src={LOGO_SRC} onError={() => setErr(true)} style={{ width: "100%", height: "100%", objectFit: "contain", borderRadius: 20, display: "block" }} alt="Team Cyber Shield" />
      }
    </div>
  );
}

function App() {
  const [screen, setScreen]     = useState("intro");
  const [level,  setLevel]      = useState(0);
  const [trust,  setTrust]      = useState(100);
  const [money,  setMoney]      = useState(50000);
  const [lost,   setLost]       = useState(0);
  const [risk,   setRisk]       = useState(0);
  const [timeLeft, setTimeLeft] = useState(0);
  const [timerMax, setTimerMax] = useState(45);
  const [feedback, setFeedback] = useState(null);
  const [badges,   setBadges]   = useState([]);
  const [shake,    setShake]    = useState(false);
  const [stats,    setStats]    = useState({ correctFirst:false, levelsCompleted:0, wrongCount:0, trust:100, moneyLost:0 });
  const [board,    setBoard]    = useState([
    { name:"CyberHero", trust:98, money:50000, levels:5, score:9800 },
    { name:"DigitalGuard", trust:85, money:45000, levels:5, score:8200 },
    { name:"Firewall_Pro", trust:72, money:38000, levels:4, score:6500 },
  ]);
  const [nameInput,   setNameInput]   = useState("");
  const [playerName,  setPlayerName]  = useState("");
  const [docTab,      setDocTab]      = useState("proposal");
  const timerRef  = useRef(null);
  const startTRef = useRef(null);
  const lv = LEVELS[level];

  const clearTimer = () => clearInterval(timerRef.current);

  const handleTimeout = useCallback(() => {
    clearTimer();
    setFeedback({ text: "⏱️ TIME'S UP! Hesitation in real scams costs you. Scammer assumed consent.", correct: false });
    setTrust(t => Math.max(0, t - 10));
    setShake(true); setTimeout(() => setShake(false), 500);
    setScreen("feedback");
  }, []);

  const startTimer = useCallback((secs) => {
    clearTimer();
    setTimeLeft(secs); setTimerMax(secs);
    startTRef.current = Date.now();
    timerRef.current = setInterval(() => {
      setTimeLeft(p => { if (p <= 1) { clearTimer(); handleTimeout(); return 0; } return p - 1; });
    }, 1000);
  }, [handleTimeout]);

  useEffect(() => {
    if (screen === "game" && lv) startTimer(lv.timer);
    return clearTimer;
  }, [screen, level]);

  useEffect(() => {
    const style = document.createElement("style");
    style.textContent = `
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #05060f; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: #00ff9c44; border-radius: 4px; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
      @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
      @keyframes badgePop { 0%{transform:scale(0);opacity:0} 70%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
      @keyframes logoPulse {
        0%   { filter: drop-shadow(0 0 12px rgba(0,200,255,0.7)) drop-shadow(0 0 30px rgba(168,85,247,0.4)) drop-shadow(0 0 60px rgba(0,200,255,0.2)); }
        50%  { filter: drop-shadow(0 0 28px rgba(0,220,255,1))   drop-shadow(0 0 60px rgba(168,85,247,0.8)) drop-shadow(0 0 100px rgba(0,200,255,0.4)); }
        100% { filter: drop-shadow(0 0 12px rgba(0,200,255,0.7)) drop-shadow(0 0 30px rgba(168,85,247,0.4)) drop-shadow(0 0 60px rgba(0,200,255,0.2)); }
      }
      .fadeUp { animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
      .shake-anim { animation: shake 0.4s ease; }
      .badge-pop { animation: badgePop 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards; }
      .logo-glow { animation: logoPulse 2.5s ease-in-out infinite; border-radius: 20px; }
    `;
    document.head.appendChild(style);
    return () => document.head.removeChild(style);
  }, []);

  const handleChoice = c => {
    clearTimer();
    const ms = Date.now() - (startTRef.current || Date.now());
    BAE.record(level + 1, c.id, c.correct, ms, c.type);
    const ns = { ...stats };
    if (level === 0 && c.correct) ns.correctFirst = true;
    if (!c.correct) { ns.wrongCount++; setShake(true); setTimeout(() => setShake(false), 500); }
    if (c.correct) setTrust(t => Math.min(100, t + c.trust));
    else {
      setTrust(t => Math.max(0, t + c.trust));
      if (c.money < 0) { setMoney(m => Math.max(0, m + c.money)); setLost(l => l - c.money); ns.moneyLost = (ns.moneyLost || 0) - c.money; }
    }
    setFeedback({ text: c.fb, correct: c.correct });
    setRisk(BAE.computeRisk()); setStats(ns); setScreen("feedback");
  };

  const nextLevel = () => {
    const nc = level + 1;
    const ns = { ...stats, levelsCompleted: nc, trust, moneyLost: lost };
    setStats(ns);
    BADGES.forEach(b => { if (b.cond(ns) && !badges.find(x => x.id === b.id)) setBadges(p => [...p, b]); });
    if (nc >= LEVELS.length) {
      const score = Math.round(trust * 100 + (money - lost) / 100);
      setBoard(p => [...p, { name: playerName || "You", trust, money, levels: 5, score }].sort((a, b) => b.score - a.score).slice(0, 8));
      setScreen("end");
    } else { setLevel(l => l + 1); setFeedback(null); setScreen("game"); }
  };

  const resetGame = () => {
    BAE.reset(); clearTimer();
    setScreen("intro"); setLevel(0); setTrust(100); setMoney(50000); setLost(0);
    setRisk(0); setFeedback(null); setBadges([]); setShake(false);
    setStats({ correctFirst:false, levelsCompleted:0, wrongCount:0, trust:100, moneyLost:0 });
    setPlayerName(""); setNameInput("");
  };

  const hudProps = { trust, money, riskScore: risk, level, badges, onBoard: () => setScreen("leaderboard"), onDocs: () => setScreen("docs"), onReset: resetGame };
  const base = { minHeight: "100vh", background: "#05060f", color: "#eaeaea", fontFamily: "'Inter',sans-serif", display: "flex", flexDirection: "column" };
  const center = { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, gap: 16 };
  const mono = { fontFamily: "monospace" };

  // ── INTRO ─────────────────────────────────────────────────────────────────
  if (screen === "intro") return (
    <div style={{ ...base, alignItems: "center", justifyContent: "center" }}>
      <BG />
      <div className="fadeUp" style={{ maxWidth: 540, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 20, padding: "0 20px" }}>
        <div style={{ textAlign: "center", display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
          <LogoImage size={180} />
          <div style={{ fontSize: 11, color: "#7b8cff", letterSpacing: 4, textTransform: "uppercase", fontWeight: 600, marginTop: 8 }}>TEAM</div>
          <div style={{ ...mono, fontSize: 30, fontWeight: 700, letterSpacing: 3, background: "linear-gradient(90deg,#00c8ff,#a855f7)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>CYBER SHIELD</div>
          <div style={{ fontSize: 12, color: "#a78bfa", letterSpacing: 3, textTransform: "uppercase" }}>Human Firewall Challenge</div>

        </div>
        <Card style={{ width: "100%", padding: 24 }}>
          <div style={{ ...mono, fontSize: 10, color: "#00ff9c66", letterSpacing: 2, marginBottom: 12 }}>// MISSION BRIEFING</div>
          {[["❤️ Trust Meter","Starts at 100. Wrong decisions drain it."],["💰 Virtual Money","$50,000 at stake. Every wrong call has a price."],["⏱️ Countdown","Pressure-timed levels mirror real scams."],["🧠 Behavioural AI","Every decision is analysed for your Risk Score."],["🏅 Badges","Earn achievements based on your cyber instincts."]].map(([k, v]) => (

  if (screen === "game" && lv) return (

                  <div key={i} style={{ padding: 12, background: "rgba(255,255,255,0.02)", borderRadius: 10, marginBottom: 10, borderLeft: "3px solid " + s.color }}>

                  </div>

              </div>
            )}
            <div style={{ borderTop: "1px solid rgba(0,255,156,0.08)", paddingTop: 14, marginTop: 14 }}>
              <Flags flags={lv.sc.flags} />
              <div style={{ fontSize: 11, color: "#00ff9c", fontWeight: 600, marginBottom: 10 }}>▶ CHOOSE YOUR ACTION:</div>
              {lv.choices.map(c => <ChoiceBtn key={c.id} choice={c} onChoose={handleChoice} />)}
            </div>
          </Card>
        )}
      </div>
    </div>
  );

  // ── FEEDBACK ──────────────────────────────────────────────────────────────
  if (screen === "feedback") return (
    <div style={base}>
      <BG />
      <HUD {...hudProps} />
      <div style={center}>
        <Card danger={!feedback?.correct} style={{ maxWidth: 560, width: "100%", padding: 28, textAlign: "center" }} className="fadeUp">
          <div style={{ fontSize: 60, marginBottom: 12, filter: "drop-shadow(0 0 14px " + (feedback?.correct ? "#00ff9c" : "#ff3b3b") + ")" }}>{feedback?.correct ? "✅" : "💀"}</div>

          <div style={{ background: "rgba(0,255,156,0.04)", border: "1px solid rgba(0,255,156,0.12)", borderRadius: 12, padding: 16, textAlign: "left", marginBottom: 20 }}>
            <div style={{ ...mono, fontSize: 10, color: "#00ff9c", letterSpacing: 2, marginBottom: 8 }}>// SECURITY INSIGHT</div>
            <div style={{ fontSize: 13, color: "#999", lineHeight: 1.6 }}>{lv?.tip}</div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10, marginBottom: 20 }}>
            {[["Trust", trust, trust > 60 ? "#00ff9c" : trust > 30 ? "#facc15" : "#ff3b3b"], ["Money", fmt(money), "#00ff9c"], ["Risk", risk, risk > 60 ? "#ff3b3b" : "#facc15"]].map(([l, v, c]) => (
              <div key={l} style={{ background: "rgba(255,255,255,0.03)", borderRadius: 10, padding: 12 }}>
                <div style={{ fontSize: 9, color: "#444", letterSpacing: 1, textTransform: "uppercase", marginBottom: 4 }}>{l}</div>
                <div style={{ ...mono, fontSize: 18, color: c, fontWeight: 700 }}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{ fontSize: 12, color: "#555", marginBottom: 16 }}>🧠 AI Pattern: <span style={{ color: "#a78bfa", fontWeight: 600 }}>{BAE.pattern()}</span></div>
          {badges.length > 0 && (
            <div style={{ marginBottom: 16, display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center" }}>
              {badges.map(b => <span key={b.id} className="badge-pop" style={{ padding: "4px 12px", borderRadius: 20, fontSize: 12, fontWeight: 600, border: "1px solid rgba(250,204,21,0.4)", color: "#facc15", background: "rgba(250,204,21,0.08)" }}>{b.icon} {b.name}</span>)}
            </div>
          )}
          {trust <= 0
            ? <PrimaryBtn danger onClick={() => setScreen("end")}>💀 View Your Ending</PrimaryBtn>
            : <PrimaryBtn onClick={nextLevel}>{level + 1 >= LEVELS.length ? "🏁 See Final Results" : "➡️ Next Level (" + (level + 2) + " of 5)"}</PrimaryBtn>}
        </Card>
      </div>
    </div>
  );

  // ── END ───────────────────────────────────────────────────────────────────
  if (screen === "end") {
    const win = trust >= 50 && stats.levelsCompleted >= 4;
    const perfect = trust >= 80 && lost === 0;
    const ec = perfect ? "#00ff9c" : win ? "#a78bfa" : "#ff3b3b";
    return (
      <div style={{ ...base, alignItems: "center", justifyContent: "center" }}>
        <BG />
        <div className="fadeUp" style={{ maxWidth: 580, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 20, padding: "0 20px" }}>
          <div style={{ fontSize: 76, filter: "drop-shadow(0 0 22px " + ec + ")", textAlign: "center" }}>{perfect ? "💎" : win ? "🛡️" : "😭"}</div>

          <Card style={{ width: "100%", padding: 24 }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10, marginBottom: 20 }}>

        ["Target Users","• Students (Grade 10 ; University)\n• Corporate employees\n• General public with limited cyber literacy\n• NGOs and community programmes across Africa"],
        ["Technology Stack","Frontend: React (JSX, Hooks)\nAI Engine: Behavioural Analysis Engine (JS)\nCurrency: Universal ($)\nHosting: Any static host (Netlify, Vercel)"],
        ["AI Tools & Research","This project was built using a combination of AI tools and collaborative research:\n\n🤖 Claude (Anthropic) ; Primary development: frontend, game logic, Behavioural Analysis Engine, UI/UX design & documentation\n\n💬 ChatGPT (OpenAI) ; Brainstorming scam scenarios, refining problem statements & initial proposal content\n\n✨ Google Gemini ; Cross-referencing cybersecurity statistics, validating scam patterns & SDG alignment research\n\n🔍 Google Research ; Sourcing cybercrime statistics, real-world scam examples & best practices in cybersecurity training\n\n🤝 Combined AI + Human Intelligence approach ; ensuring the platform is accurate, realistic, and impactful."],
        ["AI Explanation","The BAE records each decision with timestamp, correctness, choice type, and latency. It computes weighted risk based on impulsivity, authority bias, and urgency susceptibility. Users are classified into 4 archetypes: Hyper-Vigilant, Cautious but Vulnerable, Too Trusting, High Risk."],
        ["Development Process","Phase 1: Game design & scenario scripting\nPhase 2: UI/UX design system\nPhase 3: Behavioural engine\nPhase 4: HUD, badges, leaderboard\nPhase 5: Testing & balancing\nPhase 6: Documentation"],
      ],
      presentation: [
        ["Slide 1 ; Title","CYBER SHIELD: Human Firewall Challenge\nA Behavioural Cybersecurity Training System\nTeam Cyber Shield | Joint Effort | [Date]"],
        ["Slide 2 ; Problem","• Cybercrime costs Africa billions annually\n• 70% of breaches involve human error\n• Most training is boring and forgettable\n• People learn through experience"],
        ["Slide 3 ; Solution","An AI-powered cybersecurity game that:\n• Simulates real scam scenarios\n• Forces decisions under timer pressure\n• Tracks behaviour with AI analysis\n• Builds genuine cyber immunity"],
        ["Slide 4 ; Live Demo","1. Show Level 1 phishing email\n2. Make a bad decision → consequences\n3. Trust Meter drops + AI risk updates\n4. Complete level → badge unlocks\n5. Show leaderboard"],
        ["Slide 5 ; AI Component","Behavioural Analysis Engine:\n• Records every decision + response time\n• Detects authority bias & urgency susceptibility\n• Outputs Human Risk Score (0;100)\n• Classifies behavioural archetype"],
        ["Slide 6 ; SDG Impact","SDG 4: Digital literacy for all\nSDG 16: Reducing cybercrime across Africa\nTarget: Students, employees, communities\nScalable: Any device, no installation"],
        ["Slide 7 ; Roadmap","• Real-time AI via Claude API\n• Multiplayer mode\n• School curriculum package\n• Certificate system\n• Mobile app"],
        ["Slide 8 ; Close","Every person who plays Cyber Shield becomes a Human Firewall.\n[GitHub] | [Demo URL] | [QR Code]"],
      ],
      script: [
        ["Speaker 1 ; Intro (60s)","\"Cybercrime costs Africa billions every year ; mostly because of human error, not tech failures. We built Cyber Shield: the Human Firewall Challenge ; a gamified, AI-powered system that teaches people to recognise scams by safely experiencing them.\""],
        ["Speaker 2 ; Demo (90s)","\"Let me show you. I'll launch the game. [Start Level 1] ; I've received an urgent email. Look at the sender domain ; it's fake. I click the link ; Trust meter drops, money stolen, AI logs my impulsive decision.\""],
        ["Speaker 3 ; AI (60s)","\"Behind every decision is our Behavioural Analysis Engine. It tracks how fast you decide, whether you're influenced by authority or urgency, and builds a Human Risk Score across 5 levels. It tells you exactly how vulnerable you are ; and why.\""],
        ["Speaker 4 ; Close (60s)","\"Cyber Shield works on any device, requires no installation, and can be deployed in schools and workplaces immediately. Our vision: make cyber immunity universal across Africa. Thank you.\""],
      ]
    };
    return (
      <div style={base}>
        <BG />
        <HUD {...hudProps} />
        <div style={{ maxWidth: 780, margin: "0 auto", width: "100%", padding: "24px 20px" }}>
          <div style={{ ...mono, fontSize: 16, color: "#00ff9c", letterSpacing: 2, marginBottom: 16 }}>📄 PROJECT DOCUMENTATION</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
            {tabs.map(([id, label]) => (
              <button key={id} onClick={() => setDocTab(id)} style={{ padding: "7px 16px", borderRadius: 18, border: "1px solid " + (docTab===id?"#00ff9c":"rgba(0,255,156,0.25)"), background: docTab===id?"rgba(0,255,156,0.15)":"transparent", color: docTab===id?"#00ff9c":"#7fcfaa", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>{label}</button>
            ))}
            <button onClick={() => setScreen("intro")} style={{ marginLeft: "auto", padding: "7px 16px", borderRadius: 18, border: "1px solid rgba(0,255,156,0.2)", background: "transparent", color: "#7fcfaa", cursor: "pointer", fontSize: 12 }}>← Back</button>
          </div>
          <div style={{ overflowY: "auto", maxHeight: "70vh" }}>
            {(content[docTab]||[]).map(([title, text]) => (
              <Card key={title} style={{ padding: 20, marginBottom: 14 }}>
                <div style={{ ...mono, fontSize: 10, color: "#00ff9c", letterSpacing: 2, marginBottom: 10 }}>// {title.toUpperCase()}</div>
                <div style={{ fontSize: 13, color: "#778", lineHeight: 1.85, whiteSpace: "pre-line" }}>{text}</div>
              </Card>
            ))}
          </div>
        </div>
      </div>
    );
  }

  return <div style={{ ...base, alignItems: "center", justifyContent: "center" }}><div style={{ color: "#00ff9c", fontFamily: "monospace" }}>Loading...</div></div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
